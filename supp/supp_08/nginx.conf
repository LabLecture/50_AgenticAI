# [6교시 · 이론] nginx 리버스 프록시 예시
#
# 핵심 아이디어: 브라우저는 nginx(한 origin)에만 붙는다.
#   - "/"       → React 정적 빌드(npm run build 결과) 서빙
#   - "/api/"   → 백엔드(FastAPI :8000)로 프록시
#   - "/ws/"    → WebSocket 업그레이드 프록시
# 결과: 프론트·백엔드가 같은 origin → CORS 자체가 필요 없어진다(개발의 CORS 가 운영에선 사라짐).

server {
    listen 80;

    # React 정적 빌드 서빙 (SPA 라우팅: 없는 경로는 index.html 로)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # 백엔드 API 프록시
    location /api/ {
        proxy_pass http://backend:8000/;

        # ★ 스트리밍이 죽지 않게 버퍼링 끄기 (day14 슬72)
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket 업그레이드 프록시 (/ws/chat)
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;   # 긴 연결 유지
    }
}
